<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172c4d">
<meta name="description" content="Simulacro interactivo de 25 preguntas para preparar Saber 11.">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<title>Simulacro Pre-ICFES Saber 11</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f7fb;--card:#fff;--ink:#172c4d;--mut:#647089;--acc:#f4b41a;--line:#dbe2ed;--ok:#16794c;--okbg:#e2f5ea;--bad:#b42318;--badbg:#fde8e6;--shadow:0 18px 45px rgba(23,44,77,.09)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 0%,rgba(244,180,26,.16),transparent 28rem),linear-gradient(135deg,#f8fafc 0%,var(--bg) 56%,#edf2f9 100%);color:var(--ink);font:17px/1.58 Georgia,"Times New Roman",serif}
main{max-width:760px;margin:0 auto;padding:clamp(28px,6vw,64px) 18px 72px}
h1{font-size:clamp(2rem,5vw,3.25rem);line-height:1.05;letter-spacing:-.045em;margin:10px 0 14px;max-width:13ch}
h1:before{content:"SABER 11  /  PREPARACIÓN";display:block;color:var(--acc);font:800 .72rem/1 system-ui,sans-serif;letter-spacing:.14em;margin-bottom:16px}
h2{line-height:1.15;letter-spacing:-.02em}
.sub{color:var(--mut);font-family:system-ui,sans-serif;font-size:.97rem;max-width:62ch}
.bar{height:9px;background:var(--line);border-radius:99px;margin:18px 0 8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#f4b41a,#f19a2a);width:0;transition:width .35s ease}
.meta{display:flex;justify-content:space-between;gap:16px;font:700 .8rem system-ui,sans-serif;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.card{background:rgba(255,255,255,.94);border:1px solid rgba(219,226,237,.96);border-radius:20px;padding:clamp(20px,4vw,30px);margin-top:18px;box-shadow:var(--shadow)}
.area{font:800 .78rem system-ui,sans-serif;color:#c68100;text-transform:uppercase;letter-spacing:.1em}.q{font-size:clamp(1.08rem,2vw,1.3rem);line-height:1.5;margin:10px 0 18px}
.opt{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:15px 16px;margin:10px 0;font:inherit;cursor:pointer;transition:border-color .2s,transform .2s,box-shadow .2s}.opt:hover:not(:disabled){border-color:var(--acc);transform:translateY(-1px);box-shadow:0 8px 18px rgba(23,44,77,.08)}.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--acc);outline-offset:3px}.opt b{min-width:1.5em;font:800 1rem system-ui,sans-serif}.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt:disabled{cursor:default}
.fb{margin-top:16px;padding:14px 16px;border-radius:14px;font-size:.98rem}.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}.fb strong{font-family:system-ui,sans-serif}
.btn{margin-top:18px;background:var(--acc);color:#172c4d;border:0;border-radius:12px;padding:13px 22px;font:800 .98rem system-ui,sans-serif;cursor:pointer;box-shadow:0 8px 15px rgba(244,180,26,.2);transition:transform .2s,box-shadow .2s}.btn:hover{transform:translateY(-1px);box-shadow:0 12px 22px rgba(244,180,26,.3)}.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--acc);margin-left:10px;box-shadow:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:18px;font-family:system-ui,sans-serif;margin:12px 0}.big{font:800 clamp(2.5rem,8vw,4.2rem)/1 system-ui,sans-serif;letter-spacing:-.06em}.rev{border-top:1px solid var(--line);padding:15px 0;font-size:.95rem}.rev:first-of-type{margin-top:8px}
details{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:15px;margin:12px 0;padding:5px 18px;box-shadow:0 8px 22px rgba(23,44,77,.04)}summary{cursor:pointer;font:800 1.05rem system-ui,sans-serif;padding:12px 0}summary:focus-visible{outline:3px solid var(--acc)}h3{font:800 .85rem system-ui,sans-serif;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.08em}h3.hi{color:var(--ok)}h3.lo{color:var(--bad)}ul{margin:4px 0 14px;padding-left:22px}li{margin:4px 0;font-size:.98rem}.tip{border-left:5px solid var(--acc);background:rgba(255,255,255,.82);padding:15px 17px;border-radius:0 14px 14px 0;margin:18px 0;font-size:.98rem;box-shadow:0 8px 20px rgba(23,44,77,.04)}
@media (max-width:560px){main{padding-left:14px;padding-right:14px}.card{border-radius:16px;padding:20px 16px}.btn{width:100%}.btn.alt{margin-left:0}.meta{font-size:.72rem}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><main id="app"></main>
<script>
const Q=[
["Lectura crítica","«La ciudad prohibió los vehículos en el centro. Los comerciantes protestaron porque temían perder clientes, pero a los tres meses las ventas subieron 12 %, pues más gente caminaba y se detenía en las vitrinas.» ¿Cuál es la idea principal?",["Los comerciantes siempre se equivocan","La restricción, pese al temor inicial, favoreció las ventas","Caminar es mejor que conducir","Las protestas frenaron la medida"],1,"El texto contrasta el temor inicial con el resultado: las ventas subieron. Las demás opciones generalizan o inventan información que el texto no dice."],
["Lectura crítica","«Aunque el informe asegura que el agua es potable, omite que las muestras se tomaron en época de lluvias, cuando la contaminación se diluye.» ¿Qué función cumple la parte «omite que…»?",["Mostrar que el informe es completo","Sugerir que la conclusión puede ser engañosa por falta de datos","Demostrar que el agua está contaminada","Explicar el ciclo de lluvias"],1,"Señala un dato faltante que debilita la conclusión. No prueba que el agua esté contaminada: solo pone en duda la evidencia."],
["Lectura crítica","«Me dijo que vendría temprano. Por eso dejé la puerta sin seguro.» ¿Qué se puede inferir?",["Que la persona ya había llegado","Que el narrador confía en que la persona llegará pronto","Que la puerta estaba dañada","Que el narrador tiene miedo"],1,"Inferir es unir pistas: «Por eso» conecta la promesa de llegar temprano con dejar la puerta abierta. Hay confianza en que llegará."],
["Lectura crítica","«¡Compre ya! Solo hoy, el mejor celular al mejor precio. ¡No se lo pierda!» ¿Cuál es la intención comunicativa?",["Informar de forma neutral","Narrar un hecho","Explicar cómo funciona un celular","Persuadir al lector para que compre"],3,"Las órdenes («Compre ya»), la urgencia («Solo hoy») y los superlativos son recursos de un texto persuasivo (publicidad)."],
["Lectura crítica","«El orador fue categórico: no habría aumentos.» En este contexto, «categórico» significa:",["Dudoso","Rotundo, sin admitir discusión","Amable","Breve"],1,"Categórico es lo que se afirma de forma absoluta. Los dos puntos introducen una declaración firme: «no habría aumentos»."],
["Matemáticas","Un tendero compra 3 kg de arroz a $4.200 el kg y 2 kg de frijol a $6.500 el kg. ¿Cuánto paga en total?",["$10.700","$23.600","$25.600","$27.600"],2,"Arroz: 3 × 4.200 = 12.600. Frijol: 2 × 6.500 = 13.000. Total: 12.600 + 13.000 = $25.600. Error común: sumar solo los precios unitarios."],
["Matemáticas","Un artículo cuesta $150.000 y tiene 20 % de descuento. ¿Cuál es el precio final?",["$130.000","$120.000","$30.000","$170.000"],1,"20 % de 150.000 = 30.000. Precio final: 150.000 − 30.000 = $120.000. Ojo: $30.000 es el descuento, no el precio."],
["Matemáticas","Si 3x − 7 = 11, ¿cuál es el valor de x?",["6","5","4","18"],0,"Se despeja: 3x = 11 + 7 = 18, luego x = 18 ÷ 3 = 6. Verificación: 3(6) − 7 = 11. ✔"],
["Matemáticas","Una bolsa tiene 3 fichas rojas, 5 azules y 2 verdes. Al sacar una al azar, ¿cuál es la probabilidad de que sea azul?",["1/5","3/10","5/3","1/2"],3,"Probabilidad = casos favorables ÷ casos totales = 5/10 = 1/2. Una probabilidad nunca puede ser mayor que 1 (por eso 5/3 es imposible)."],
["Matemáticas","¿Cuál es el área de un triángulo de base 10 cm y altura 6 cm?",["16 cm²","30 cm²","60 cm²","36 cm²"],1,"Área = (base × altura) ÷ 2 = (10 × 6) ÷ 2 = 30 cm². 60 es el área del rectángulo: olvidar dividir entre 2 es el error típico."],
["Sociales y ciudadanas","¿Qué mecanismo de la Constitución de 1991 protege de forma rápida los derechos fundamentales?",["Referendo","Acción de tutela","Plebiscito","Cabildo abierto"],1,"La tutela (art. 86) permite pedir a un juez la protección inmediata de un derecho fundamental vulnerado. Los otros son mecanismos de participación política."],
["Sociales y ciudadanas","¿Qué institución ejerce la función legislativa (hacer las leyes) en Colombia?",["Rama Ejecutiva","Rama Judicial","El Congreso de la República","La Procuraduría"],2,"El Congreso (Senado y Cámara) crea, reforma y deroga leyes. El Ejecutivo gobierna y la Judicial aplica las leyes."],
["Sociales y ciudadanas","La Guerra Fría fue una tensión geopolítica entre dos bloques liderados por:",["EE. UU. y la URSS","Alemania y Japón","China e India","Francia y Reino Unido"],0,"Tras la Segunda Guerra Mundial el mundo se dividió entre el bloque capitalista (EE. UU.) y el socialista (URSS), sin enfrentamiento directo entre ambos."],
["Sociales y ciudadanas","¿En qué año se consolidó la independencia de la Nueva Granada con la Batalla de Boyacá?",["1781","1810","1830","1819"],3,"El 7 de agosto de 1819 el ejército de Bolívar venció en Boyacá. 1810 es el Grito de Independencia (20 de julio); 1830 es el año de la muerte de Bolívar."],
["Sociales y ciudadanas","¿Cuál es un mecanismo de participación ciudadana?",["La revocatoria del mandato","Un decreto","Una sentencia","Una sanción"],0,"La revocatoria permite a los ciudadanos terminar el mandato de un gobernante elegido. Decretos, sentencias y sanciones los emiten autoridades."],
["Ciencias naturales","¿Qué gas toman las plantas del aire para realizar la fotosíntesis?",["Oxígeno (O₂)","Nitrógeno (N₂)","Dióxido de carbono (CO₂)","Hidrógeno (H₂)"],2,"Fotosíntesis: CO₂ + agua + luz → glucosa + O₂. Las plantas absorben CO₂ y liberan oxígeno."],
["Ciencias naturales","Un carro recorre 150 km en 2 horas a velocidad constante. ¿Cuál es su velocidad?",["300 km/h","152 km/h","148 km/h","75 km/h"],3,"v = distancia ÷ tiempo = 150 ÷ 2 = 75 km/h. Multiplicar (300) es el error común al confundir la fórmula."],
["Ciencias naturales","¿Cuál es un ejemplo de mezcla homogénea?",["Agua y aceite","Agua con sal disuelta","Arena y agua","Una ensalada"],1,"En una mezcla homogénea no se distinguen sus componentes a simple vista (una sola fase). Las otras muestran fases o partes visibles."],
["Ciencias naturales","En una célula eucariota, ¿dónde se encuentra el material genético (ADN)?",["Ribosoma","Membrana","Núcleo","Vacuola"],2,"El núcleo, delimitado por una membrana, guarda el ADN. Los ribosomas fabrican proteínas."],
["Ciencias naturales","Un objeto en reposo permanece en reposo si no actúa una fuerza neta sobre él. Esto corresponde a:",["La primera ley de Newton (inercia)","La segunda ley de Newton","La tercera ley de Newton","La ley de gravitación"],0,"La primera ley establece la inercia. La segunda es F = m·a y la tercera, acción y reacción."],
["Inglés","She ___ to school every day.",["go","goes","going","gone"],1,"Presente simple con she/he/it: el verbo lleva -s o -es → «goes»."],
["Inglés","If it rains tomorrow, we ___ at home.",["stay","stayed","will stay","would stayed"],2,"Primer condicional: If + presente simple, … will + verbo base. Habla de una posibilidad real en el futuro."],
["Inglés","«I'm looking forward to the trip» means:",["I am afraid of it","I forgot about it","I am looking behind me","I am excited about it"],3,"«Look forward to» = esperar algo con ilusión. No tiene relación literal con mirar hacia adelante."],
["Inglés","A sign says «No parking». It means:",["You cannot leave your car here","You can park here","Parking is free","Parking is for sale"],0,"«No + sustantivo» indica prohibición: no está permitido estacionar."],
["Inglés","Choose the correct option: I have ___ apple.",["a","an","the","some"],1,"Se usa «an» antes de sonido vocálico: an apple. «A» se usa antes de sonido consonante."]
];
const L="ABCD",app=document.getElementById("app");let i=0,ans=[];
function intro(){app.innerHTML=`<h1>Simulacro Pre-ICFES Saber 11</h1><p class="sub">25 preguntas: 5 de Lectura crítica, Matemáticas, Sociales y ciudadanas, Ciencias naturales e Inglés. Al elegir una opción verás si es correcta y por qué.</p><button class="btn" id="go">Empezar simulacro</button><button class="btn alt" id="gd">Guía de estudio</button>`;document.getElementById("go").onclick=()=>{i=0;ans=[];show()};document.getElementById("gd").onclick=guide}
function show(){const q=Q[i];app.innerHTML=`<div class="meta"><span>Pregunta ${i+1} de ${Q.length}</span><span>${ans.filter((a,k)=>a===Q[k][3]).length} correctas</span></div><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><div class="card"><div class="area">${q[0]}</div><p class="q">${q[1]}</p><div id="opts">${q[2].map((o,k)=>`<button class="opt" data-k="${k}"><b>${L[k]}.</b><span>${o}</span></button>`).join("")}</div><div id="fb" aria-live="polite"></div></div>`;
app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k))}
function pick(k){const q=Q[i],ok=k===q[3];ans[i]=k;
app.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(j===q[3])b.classList.add("ok");else if(j===k)b.classList.add("bad")});
document.getElementById("fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><strong>${ok?"¡Correcto!":"Incorrecto. La respuesta es "+L[q[3]]+"."}</strong> ${q[4]}</div><button class="btn" id="nx">${i<Q.length-1?"Siguiente":"Ver resultados"}</button>`;
const n=document.getElementById("nx");n.focus();n.onclick=()=>{i++;i<Q.length?show():end()}}
function end(){const areas={};Q.forEach((q,k)=>{(areas[q[0]]=areas[q[0]]||[0,0])[1]++;if(ans[k]===q[3])areas[q[0]][0]++});
const t=ans.filter((a,k)=>a===Q[k][3]).length,pct=Math.round(t/Q.length*100);
const miss=Q.map((q,k)=>[q,k]).filter(([q,k])=>ans[k]!==q[3]);
const weak=Object.entries(areas).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1])[0][0];
app.innerHTML=`<h1>Resultados</h1><div class="card"><div class="big">${t}/${Q.length} · ${pct} %</div>${Object.entries(areas).map(([a,v])=>`<div class="row"><span>${a}</span><b>${v[0]}/${v[1]}</b></div>`).join("")}<p class="sub">Área para reforzar esta noche: <b>${weak}</b>.</p></div>
<div class="card"><h2 style="margin:0 0 6px;font-size:1.2rem">${miss.length?"Repasa lo que fallaste":"¡Sin errores!"}</h2>${miss.map(([q,k])=>`<div class="rev"><b>${k+1}. ${q[1]}</b><br>Tu respuesta: ${L[ans[k]]}. Correcta: ${L[q[3]]}. ${q[2][q[3]]}<br><span class="sub">${q[4]}</span></div>`).join("")}</div><button class="btn" id="re">Repetir simulacro</button>`;document.getElementById("re").onclick=intro}
const G=[
["Lectura crítica y comprensión",["Idea principal y propósito del autor (informar, persuadir, narrar, explicar)","Inferencias: lo que el texto sugiere sin decirlo","Hecho vs. opinión","Tipos de texto: argumentativo, expositivo, narrativo, publicitario","Función de un párrafo, una frase o un conector (sin embargo, por lo tanto, además)","Textos discontinuos: tablas, gráficas, infografías, caricaturas, avisos","Qué fortalece o debilita una tesis; argumento y contraargumento","Vocabulario según el contexto"],["Falacias: ad hominem, falsa generalización, falsa causa, apelación a la autoridad","Ironía y sátira","Voz del narrador en textos literarios y poemas","Comparar dos textos con posturas opuestas","Textos filosóficos cortos con la tesis implícita"]],
["Matemáticas",["Porcentajes, descuentos y regla de tres (proporcionalidad)","Lectura de gráficas y tablas","Media, mediana y moda","Probabilidad simple","Ecuaciones lineales y problemas con enunciado","Áreas, perímetros y volúmenes; teorema de Pitágoras","Funciones lineales: pendiente e intercepto"],["Combinatoria: permutaciones y combinaciones","Funciones cuadráticas y vértice de la parábola","Desviación estándar y varianza","Trigonometría básica (seno, coseno, tangente)","Sucesiones y progresiones","Interés compuesto","Distancia entre dos puntos en el plano"]],
["Sociales y ciudadanas",["Constitución de 1991: derechos, deberes y mecanismos (tutela, referendo, revocatoria)","Ramas del poder público y órganos de control","Conflicto armado colombiano y Acuerdo de Paz de 2016","Primera y Segunda Guerra Mundial, Guerra Fría","Independencia de Colombia y sus fechas clave","Analizar perspectivas distintas sobre un mismo conflicto","Oferta y demanda, inflación, desempleo","Derechos humanos y Derecho Internacional Humanitario"],["Revolución Industrial y Revolución Francesa","Liberalismo vs. socialismo","Contrato social: Hobbes, Locke y Rousseau","Globalización y organismos internacionales (ONU, OEA)","Frente Nacional y La Violencia"]],
["Ciencias naturales",["Fotosíntesis y respiración celular","Cadenas tróficas, ecosistemas y relaciones entre especies","Genética mendeliana: cuadro de Punnett","Mezclas, métodos de separación y cambios de estado","Tabla periódica y tipos de enlace","Leyes de Newton, velocidad y aceleración","Circuitos eléctricos y ley de Ohm (V = I·R)","Diseño experimental: variable dependiente, independiente y control"],["Balanceo de ecuaciones y estequiometría","pH: ácidos y bases","Ondas y sonido","Mutaciones y evolución (selección natural)","Electromagnetismo","Gases ideales"]],
["Inglés",["Avisos y carteles (No parking, Exit, Wet floor)","Mini-conversaciones: elegir la respuesta natural","Presente simple y continuo, pasado simple, futuro con will / going to","Preposiciones de lugar y tiempo (in, on, at)","There is / there are; artículos a / an / the","Completar un texto con la palabra correcta","Comprensión de lecturas cortas"],["Condicionales 2.º y 3.º","Voz pasiva","Phrasal verbs (give up, look for)","Reported speech","Pronombres relativos (who, which, whose)","Modales perfectos (should have, might have)"]]
];
function guide(){app.innerHTML=`<h1>Guía de estudio</h1><p class="sub">Cada área separa lo que casi siempre sale de lo que sale poco, pero puede aparecer. Prioriza lo primero.</p><div class="tip"><b>Estrategia de lectura crítica:</b> lee primero la pregunta, luego el texto. Descarta opciones con «siempre», «nunca» o «todos». La respuesta correcta se apoya en el texto, no en tu opinión. Si dudas entre dos, elige la que dice menos y se puede comprobar.</div>`+G.map((g,k)=>`<details${k?"":" open"}><summary>${g[0]}</summary><h3 class="hi">Muy probable</h3><ul>${g[1].map(x=>`<li>${x}</li>`).join("")}</ul><h3 class="lo">Poco probable, pero posible</h3><ul>${g[2].map(x=>`<li>${x}</li>`).join("")}</ul></details>`).join("")+`<div class="tip"><b>Día del examen:</b> responde todo (no se penaliza el error), calcula unos 2 minutos por pregunta, marca las difíciles y vuelve después. Lleva documento, lápiz, borrador y sacapuntas, y duerme bien.</div><button class="btn" id="go2">Hacer el simulacro</button><button class="btn alt" id="bk">Volver</button>`;document.getElementById("go2").onclick=()=>{i=0;ans=[];show()};document.getElementById("bk").onclick=intro;window.scrollTo(0,0)}
intro();
</script></body></html>
